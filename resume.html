<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume · Rahul M Koushik</title>
<meta name="description" content="Resume and full CV of Rahul M Koushik, AI Engineer.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f3ec;--paper2:#efebe2;--ink:#17161a;--ink2:#4d4a52;--mute:#6b6772;--line:rgba(23,22,26,.12);--card:#fffdf8;--navy:#1f1d2b;--sans:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-right:auto}
.back i{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.tabs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink2)}
.tabs button.on{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.btn.dark{background:var(--navy);color:#fff;border-color:transparent}
.btn:hover{background:var(--paper2)}.btn.dark:hover{background:#2c2a3b}
main{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 2px 16px;color:var(--mute);font-size:13px;font-weight:600}
.pages{display:grid;gap:18px}
.page{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.page.in{opacity:1;transform:none}
.page canvas{display:block;width:100%;height:auto}
.skel{aspect-ratio:1/1.414;background:linear-gradient(90deg,#fff 0,#f4f1ea 50%,#fff 100%);background-size:200% 100%;animation:sh 1.4s linear infinite;border:1px solid var(--line);border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
.fallback{display:none;padding:28px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
@media(prefers-reduced-motion:reduce){.page{opacity:1;transform:none;transition:none}.skel{animation:none}}
@media(max-width:560px){.back span{display:none}.btn{height:36px;padding:0 12px}}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="back" href="./"><i>RK</i><span>Rahul M Koushik</span></a>
  <div class="tabs" role="tablist" aria-label="Choose document">
    <button role="tab" data-doc="resume" class="on" aria-selected="true">One page</button>
    <button role="tab" data-doc="cv" aria-selected="false">Full CV</button>
  </div>
  <a class="btn dark" id="dl" href="Resume.pdf" download="Rahul_Koushik_Resume.pdf">Download PDF</a>
</div></header>
<main>
  <div class="meta"><span id="what">One-page resume</span><span id="count"></span></div>
  <div class="pages" id="pages"><div class="skel"></div></div>
  <div class="fallback" id="fb">The viewer could not load here. <a href="Resume.pdf" id="fblink" style="text-decoration:underline">Open the PDF directly</a>.</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
'use strict';
var DOCS={resume:{file:'Resume.pdf',name:'Rahul_Koushik_Resume.pdf',label:'One-page resume'},cv:{file:'CV.pdf',name:'Rahul_Koushik_CV.pdf',label:'Full CV, every role, project and paper'}};
var pagesEl=document.getElementById('pages'),dl=document.getElementById('dl'),what=document.getElementById('what'),count=document.getElementById('count'),fb=document.getElementById('fb'),fblink=document.getElementById('fblink');
var cur=null,token=0;
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.05}):null;
function show(key){
  if(cur===key)return;cur=key;var d=DOCS[key],my=++token;
  document.querySelectorAll('.tabs button').forEach(function(b){var on=b.dataset.doc===key;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  dl.href=d.file;dl.setAttribute('download',d.name);what.textContent=d.label;fblink.href=d.file;count.textContent='';
  history.replaceState(null,'',key==='cv'?'#cv':'#resume');
  pagesEl.innerHTML='<div class="skel"></div>';fb.style.display='none';
  if(!window.pdfjsLib){pagesEl.innerHTML='';fb.style.display='block';return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument(d.file).promise.then(function(pdf){
    if(my!==token)return;pagesEl.innerHTML='';count.textContent=pdf.numPages+(pdf.numPages===1?' page':' pages');
    var dpr=Math.min(window.devicePixelRatio||1,2),chain=Promise.resolve();
    for(var i=1;i<=pdf.numPages;i++)(function(n){chain=chain.then(function(){return pdf.getPage(n).then(function(page){
      if(my!==token)return;
      var w=pagesEl.clientWidth||900,base=page.getViewport({scale:1}),vp=page.getViewport({scale:(w/base.width)*dpr});
      var wrap=document.createElement('div');wrap.className='page';var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.setAttribute('aria-label','Page '+n);wrap.appendChild(c);pagesEl.appendChild(wrap);
      if(io)io.observe(wrap);else wrap.classList.add('in');
      return page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise})})})(i);
  }).catch(function(){if(my!==token)return;pagesEl.innerHTML='';fb.style.display='block'});
}
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.doc)})});
show(location.hash==='#cv'?'cv':'resume');
})();
</script>
</body>
</html>
